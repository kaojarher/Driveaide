<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MBQ 行車系統</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
<script src="https://unpkg.com/dayjs@1.11.10/locale/zh-tw.js"></script>

<style>
/* ══════════════ TOKENS ══════════════ */
:root{
  --a:#f0a500;  --ag:rgba(240,165,0,.45); --ad:rgba(240,165,0,.1);
  --c:#00e5ff;  --cg:rgba(0,229,255,.2);
  --g:#00e676;  --r:#ff3b3b;
  --bg:#07090e; --p1:#0b0f18; --p2:#101520; --p3:#161e2e;
  --bo:rgba(255,255,255,.07); --boa:rgba(240,165,0,.3);
  --t:#dde8ff;  --td:#4a5870; --tm:#8099bb;
  --hud:'Orbitron',monospace; --ui:'Noto Sans TC',sans-serif;
  --touch:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background:var(--bg)}
body{font-family:var(--ui);color:var(--t);
  display:flex;flex-direction:column;height:100dvh}

/* ══════════════ STATUS BAR ══════════════ */
.sbar{
  height:38px;display:flex;justify-content:space-between;align-items:center;
  padding:0 10px;background:rgba(0,0,0,.6);border-bottom:1px solid var(--bo);
  flex-shrink:0;position:relative;z-index:100;
}
.snav{display:flex;gap:0}
.snb{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--td);cursor:pointer;transition:color .2s}
.snb:active{color:var(--a)}
.sinfo{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--td)}
.dot{width:7px;height:7px;border-radius:50%}
.dot-g{background:var(--g);box-shadow:0 0 5px var(--g)}
.dot-a{background:var(--a);box-shadow:0 0 5px var(--a)}
.dot-o{background:#2a2a2a}
#sb-clk{font-family:var(--hud);font-size:15px;color:var(--c);
  letter-spacing:.5px;font-variant-numeric:tabular-nums}

/* ══════════════ PAGES ══════════════ */
.page{display:none;flex:1;min-height:0;overflow:hidden}
.page.on{display:flex}

/* ══════════════════════════════════════
   HOME PAGE — faithful to MBQ photo
══════════════════════════════════════ */
#pg-home{
  position:relative;
  flex-direction:row;
  overflow:hidden;
}

/* ── TUNNEL BACKGROUND (amber glow on sides) ── */
#pg-home::before{
  content:'';
  position:absolute;inset:0;
  background:
    /* left amber arch */
    radial-gradient(ellipse 55% 90% at -5% 50%, rgba(240,165,0,.22) 0%, transparent 70%),
    /* right amber arch */
    radial-gradient(ellipse 55% 90% at 105% 50%, rgba(240,165,0,.22) 0%, transparent 70%),
    /* center floor glow */
    radial-gradient(ellipse 40% 30% at 50% 100%, rgba(240,165,0,.15) 0%, transparent 60%),
    /* overall dark */
    linear-gradient(180deg, #0a0e18 0%, #060810 100%);
  pointer-events:none;z-index:0;
}

/* side amber border lines */
#pg-home::after{
  content:'';
  position:absolute;
  top:8%;bottom:8%;
  left:calc(33% - 1px);
  width:2px;
  background:linear-gradient(to bottom,transparent,var(--a),transparent);
  box-shadow:0 0 14px var(--a);
  pointer-events:none;z-index:1;
}

/* ── THREE COLUMNS ── */
.col-l,.col-c,.col-r{
  position:relative;z-index:2;
  display:flex;flex-direction:column;
}
.col-l{
  width:33%;flex-shrink:0;
  padding:10px 10px 6px 12px;gap:8px;
  border-right:1px solid rgba(240,165,0,.18);
}
.col-c{
  flex:1;min-width:0;
  align-items:center;justify-content:space-between;
  padding:6px 0 0;
}
.col-r{
  width:30%;flex-shrink:0;
  padding:10px 12px 6px 10px;gap:8px;
  border-left:1px solid rgba(240,165,0,.18);
}

/* right amber line (mirror) */
.col-r::before{
  content:'';
  position:absolute;top:8%;bottom:8%;right:calc(100%);
  width:2px;
  background:linear-gradient(to bottom,transparent,var(--a),transparent);
  box-shadow:0 0 14px var(--a);
}

/* ── LEFT: CLOCK + WEATHER ── */
.lbl{font-family:var(--hud);font-size:9px;letter-spacing:2px;
  color:var(--td);text-transform:uppercase;margin-bottom:2px}
.pip{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--g);box-shadow:0 0 4px var(--g);margin-right:4px;
  animation:blink 2s ease-in-out infinite;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

/* CLOCK — big like photo */
.clk-ampm{font-family:var(--hud);font-size:11px;color:var(--td);letter-spacing:1px}
.clk-time{
  font-family:var(--hud);font-weight:900;
  font-size:clamp(36px,6vw,58px);
  color:var(--a);
  text-shadow:0 0 18px var(--ag);
  letter-spacing:3px;line-height:1;
  font-variant-numeric:tabular-nums;
}
.clk-day{font-size:clamp(13px,2vw,17px);color:var(--tm);font-weight:700;margin-top:3px}
.clk-date{font-family:var(--hud);font-size:clamp(10px,1.4vw,13px);color:var(--td);
  letter-spacing:1px;margin-top:2px;font-variant-numeric:tabular-nums}

/* WEATHER */
.wx-row{display:flex;align-items:center;gap:8px}
.wx-ico{font-size:clamp(28px,4vw,38px);line-height:1}
.wx-tmp{font-family:var(--hud);font-size:clamp(24px,3.5vw,34px);font-weight:900;
  color:var(--c);text-shadow:0 0 12px var(--cg)}
.wx-desc{font-size:clamp(12px,1.6vw,16px);color:var(--tm);font-weight:700;margin-top:2px}
.wx-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--bo);border-radius:20px;
  padding:3px 8px;font-size:clamp(11px,1.4vw,13px);color:var(--tm);
  display:flex;align-items:center;gap:3px}

/* COMPASS (small, in left col) */
.cmp-wrap{width:70px;height:70px;margin:0 auto}
.cmp-wrap svg{width:100%;height:100%}
.hdg{text-align:center;font-family:var(--hud);font-size:clamp(16px,2.2vw,22px);
  font-weight:700;color:var(--a);font-variant-numeric:tabular-nums}
.hdg-d{text-align:center;font-size:clamp(10px,1.3vw,13px);color:var(--tm);margin-top:1px}

/* ── CENTER: SPEED + CAR ── */
.spd-top{
  display:flex;flex-direction:column;align-items:center;
  padding-top:6px;gap:2px;
}
.spd-unit-top{
  font-family:var(--hud);font-size:clamp(10px,1.4vw,14px);
  color:var(--tm);letter-spacing:3px;
}
/* THE BIG SPEED NUMBER — like photo */
.spd-big{
  font-family:var(--hud);font-weight:900;
  font-size:clamp(60px,14vw,130px);
  color:var(--t);
  text-shadow:0 0 30px rgba(255,255,255,.3);
  line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:2px;
  /* amber outline glow when moving */
  transition:color .3s,text-shadow .3s;
}
.spd-big.moving{
  color:var(--a);
  text-shadow:0 0 30px var(--ag),0 0 60px rgba(240,165,0,.2);
}
/* Speed box style removed */
.gps-bdg{
  font-family:var(--hud);font-size:10px;letter-spacing:1px;
  padding:3px 10px;border-radius:20px;margin-top:4px;
}
.bdg-ok{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:var(--g)}
.bdg-w{background:var(--ad);border:1px solid var(--boa);color:var(--a)}
.bdg-e{background:rgba(255,59,59,.08);border:1px solid rgba(255,59,59,.3);color:var(--r)}

/* CAR SVG — bottom of center */
.car-area{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;padding-bottom:6px;gap:4px;
  position:relative;width:100%;
}
/* floor glow under car */
.car-area::before{
  content:'';
  position:absolute;bottom:0;left:10%;right:10%;height:40px;
  background:radial-gradient(ellipse 80% 100% at 50% 100%,rgba(240,165,0,.25),transparent);
  pointer-events:none;
}
.car-svg{
  width:clamp(60px,12vw,110px);
  filter:drop-shadow(0 0 12px rgba(240,165,0,.6))
         drop-shadow(0 4px 8px rgba(0,0,0,.8));
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.spd-ext{
  display:flex;gap:16px;
  font-family:var(--hud);font-size:10px;color:var(--td);
  margin-bottom:2px;
}
.se{display:flex;flex-direction:column;align-items:center;gap:1px}
.se-v{font-size:13px;color:var(--tm);font-weight:700;font-variant-numeric:tabular-nums}

/* ── RIGHT: RADIO ── */
.disc{
  width:clamp(50px,8vw,72px);height:clamp(50px,8vw,72px);
  background:conic-gradient(#888,#ccc,#eee,#ccc,#888,#ccc,#eee,#888,#ccc,#888);
  border-radius:50%;margin:4px auto;position:relative;
  animation:spin 4s linear infinite;
  box-shadow:0 0 12px rgba(200,200,200,.2);
}
.disc::after{content:'';position:absolute;inset:30%;background:#ddd;border-radius:50%;
  border:3px solid #999;box-shadow:inset 0 0 6px #666}
.disc::before{content:'';position:absolute;inset:38%;background:var(--p2);border-radius:50%;
  z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.disc.paused{animation-play-state:paused}

.freq-v{font-family:var(--hud);font-size:clamp(14px,2vw,20px);font-weight:700;
  color:var(--t);text-align:center;letter-spacing:1px}
.freq-n{font-size:clamp(11px,1.4vw,14px);color:var(--tm);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.mrow{display:flex;justify-content:center;gap:8px;margin-top:4px}
.mb{background:rgba(255,255,255,.06);border:1px solid var(--bo);border-radius:8px;
  color:var(--t);flex:1;height:44px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:18px;transition:all .2s;max-width:52px}
.mb:active,.mb:hover{background:var(--ad);color:var(--a)}
.mb.on{background:var(--cg);color:var(--c)}
.rb-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bo) transparent}
.rb-i{padding:6px 6px;font-size:clamp(11px,1.4vw,14px);color:var(--tm);cursor:pointer;
  border-radius:6px;transition:background .15s;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-height:36px;display:flex;align-items:center;font-weight:700}
.rb-i:active,.rb-i:hover{background:rgba(255,255,255,.06);color:var(--t)}
.rb-i.cur{color:var(--c);background:var(--cg)}

/* shortcut strip in right col bottom */
.sc-strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sc-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 6px;border-radius:10px;cursor:pointer;
  border:1px solid var(--bo);background:rgba(255,255,255,.03);
  transition:all .2s;min-width:52px;
}
.sc-btn:active,.sc-btn:hover{border-color:var(--boa);background:var(--ad)}
.sc-ico{font-size:clamp(18px,3vw,24px)}
.sc-lbl{font-size:clamp(9px,1.2vw,11px);color:var(--td);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:54px;font-weight:700}

/* ══════════════ BOTTOM QUICKBAR ══════════════ */
.qbar{
  display:flex;background:rgba(3,5,8,.95);
  border-top:1px solid var(--bo);flex-shrink:0;
  overflow-x:auto;scrollbar-width:none;position:relative;z-index:50;
}
.qbar::-webkit-scrollbar{display:none}
.qi{
  flex:1;min-width:62px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:58px;cursor:pointer;border-right:1px solid var(--bo);
  gap:3px;transition:background .2s;position:relative;
}
.qi:last-child{border-right:none}
.qi:active,.qi:hover{background:rgba(255,255,255,.04)}
.qi.on{background:var(--ad)}
.qi.on .qi-l{color:var(--a)}
.qi-i{font-size:clamp(18px,3vw,24px)}
.qi-l{font-size:clamp(10px,1.5vw,13px);color:var(--td);font-weight:700;white-space:nowrap}

/* ══════════════ ALERT ══════════════ */
.alert-bar{
  display:none;background:linear-gradient(90deg,rgba(255,59,59,.22),transparent);
  border-top:2px solid var(--r);padding:5px 16px;
  font-size:clamp(13px,2vw,18px);color:#ff8a80;font-weight:700;
  align-items:center;gap:8px;font-family:var(--hud);flex-shrink:0;
}

/* ══════════════ OTHER PAGES ══════════════ */
#pg-apps,#pg-sc,#pg-map{
  flex-direction:column;padding:10px;gap:10px;overflow-y:auto;
}
.page-hdr{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-hdr h2{font-family:var(--hud);font-size:clamp(16px,3vw,22px);color:var(--a)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:0 18px;height:var(--touch);border-radius:12px;
  font-size:clamp(14px,2vw,18px);font-weight:700;cursor:pointer;border:2px solid;
  font-family:var(--ui);transition:all .2s;white-space:nowrap}
.btn-a{background:var(--a);border-color:var(--a);color:#000}
.btn-a:hover{opacity:.85}
.btn-s{background:transparent;border-color:var(--bo);color:var(--tm)}
.btn-s:hover{border-color:var(--a);color:var(--a)}
.btn-g{background:rgba(0,230,118,.12);border-color:rgba(0,230,118,.35);color:var(--g)}
.btn-c{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.3);color:var(--c)}

/* APPS GRID */
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.app-item{display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:16px 8px;border-radius:16px;cursor:pointer;
  border:1px solid var(--bo);background:var(--p3);
  transition:all .2s;min-height:100px;justify-content:center}
.app-item:active,.app-item:hover{border-color:var(--boa);background:var(--ad);transform:scale(.97)}
.app-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.app-ico img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.app-lbl{font-size:clamp(12px,1.8vw,15px);color:var(--tm);text-align:center;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95px}

/* SHORTCUTS PAGE */
.io-area{background:var(--p2);border:1px solid var(--bo);border-radius:14px;
  padding:14px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.io-area h3{font-family:var(--hud);font-size:clamp(14px,2vw,17px);color:var(--a)}
.io-note{background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.18);border-radius:10px;
  padding:10px 14px;font-size:clamp(13px,1.8vw,16px);color:var(--tm);line-height:1.8}
.io-note b{color:var(--c)}
.io-btns{display:flex;gap:8px;flex-wrap:wrap}
.file-lbl{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:0 18px;height:var(--touch);border-radius:12px;
  font-size:clamp(14px,2vw,18px);font-weight:700;cursor:pointer;
  border:2px solid rgba(0,229,255,.3);color:var(--c);
  background:rgba(0,229,255,.1);transition:all .2s;white-space:nowrap}
.file-lbl:hover{background:rgba(0,229,255,.2)}
.file-lbl input{display:none}
#import-status{font-size:15px;color:var(--tm);display:none;
  padding:8px 12px;background:var(--p3);border-radius:10px;font-weight:700}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sc-item{display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 10px;border-radius:16px;border:1px solid var(--bo);background:var(--p3);
  position:relative;min-height:120px;justify-content:center;cursor:pointer;transition:all .2s}
.sc-item:hover{border-color:var(--boa)}
.sc-ico2{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-size:26px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.sc-ico2 img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.sc-name{font-size:clamp(13px,1.8vw,16px);color:var(--t);text-align:center;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:115px}
.sc-url2{font-size:11px;color:var(--td);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:115px}
.sc-acts{position:absolute;inset:0;border-radius:16px;
  background:rgba(6,8,16,.82);display:none;align-items:center;
  justify-content:center;gap:10px}
.sc-item:hover .sc-acts{display:flex}
.sc-ab{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:20px;cursor:pointer;
  border:1px solid var(--bo);background:var(--p2);transition:all .15s}
.sc-ab:hover{transform:scale(1.1)}

/* MAP PAGE */
#pg-map{padding:0;gap:0}
#full-map{width:100%;flex:1;min-height:0}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);
  backdrop-filter:blur(8px);z-index:9000;align-items:center;justify-content:center;padding:12px}
.overlay.on{display:flex}
.modal{background:var(--p1);border:1px solid var(--boa);border-radius:18px;
  padding:18px;width:100%;max-width:460px;max-height:92vh;
  overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal h3{font-family:var(--hud);font-size:18px;color:var(--a)}
.frow{display:flex;flex-direction:column;gap:5px}
.frow label{font-size:11px;color:var(--td);letter-spacing:1.5px;
  font-family:var(--hud);text-transform:uppercase}
.frow input{background:var(--p3);border:2px solid var(--bo);border-radius:10px;
  color:var(--t);padding:12px 14px;font-size:clamp(16px,2.5vw,20px);font-family:var(--ui);
  outline:none;transition:border-color .2s;width:100%;min-height:var(--touch)}
.frow input:focus{border-color:var(--a)}
.ico-pv-wrap{display:flex;align-items:center;gap:12px}
.ico-pv{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;font-size:32px;border:2px solid var(--boa);flex-shrink:0}
.emoji-scroll{display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow-y:auto;
  border:2px solid var(--bo);border-radius:10px;padding:7px;background:var(--p3)}
.ep{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:24px;cursor:pointer;
  border:2px solid transparent;transition:all .15s}
.ep:hover,.ep.on{background:var(--ad);border-color:var(--a)}
.col-row{display:flex;flex-wrap:wrap;gap:7px}
.csw{width:38px;height:38px;border-radius:9px;cursor:pointer;
  border:3px solid transparent;transition:all .15s}
.csw.on{border-color:#fff;transform:scale(1.15)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}

/* TOAST */
#toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  background:var(--p1);border:2px solid var(--boa);border-radius:12px;
  padding:12px 24px;font-size:clamp(14px,2vw,18px);color:var(--a);
  font-family:var(--hud);z-index:99999;
  box-shadow:0 6px 28px rgba(0,0,0,.7);
  opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}

/* ══ MOBILE ≤480px ══ */
@media(max-width:480px){
  .col-l{width:38%;padding:6px 6px 4px 8px}
  .col-r{width:34%;padding:6px 8px 4px 6px}
  .clk-time{font-size:clamp(28px,9vw,44px)!important}
  .spd-big{font-size:clamp(48px,18vw,80px)!important}
  .car-svg{width:clamp(48px,14vw,80px)!important}
  .cmp-wrap{width:58px!important;height:58px!important}
  .hdg{font-size:16px!important}

<script>
'use strict';
dayjs.locale('zh-tw');
const $=id=>document.getElementById(id);

/* ── CLOCK ── */
function tickClock(){
  const n=dayjs(),h=n.hour(),m=n.minute(),pm=h>=12?'PM':'AM',h12=h%12||12;
  const p=x=>String(x).padStart(2,'0');
  $('clock').textContent=`${p(h12)}:${p(m)}`;
  $('sb-clk').textContent=`${p(h12)}:${p(m)}`;
  $('ampm').textContent=pm;
  const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  $('weekday').textContent=days[n.day()];
  $('datedisp').textContent=n.format('YYYY-MM-DD');
}
tickClock();setInterval(tickClock,1000);

/* ── PAGE SWITCH ── */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');
}
function goHome(){showPage('pg-home');qact($('qi-home'))}
function qact(el){document.querySelectorAll('.qi').forEach(q=>q.classList.remove('on'));if(el)el.classList.add('on')}

/* ── GPS ── */
let map,mapMarker,fullMap,fullMarker,gpsWatch=null,lastLa=22.627,lastLo=120.301;

function startGPS(){
  if(!navigator.geolocation){setBdg('e','不支援GPS');return}
  setBdg('w','定位中…');
  if(gpsWatch)navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch=navigator.geolocation.watchPosition(pos=>{
    const{latitude:la,longitude:lo,speed,altitude,accuracy,heading}=pos.coords;
    lastLa=la;lastLo=lo;
    $('gps-dot').className='dot dot-a';
    const kmh=speed?Math.max(0,speed*3.6):0;
    setSpeed(kmh);
    setBdg('ok','✅ GPS 即時');
    $('alt-v').textContent=altitude!=null?Math.round(altitude):'--';
    $('acc-v').textContent=accuracy!=null?Math.round(accuracy):'--';
    if(heading!=null&&!isNaN(heading))rotateCompass(heading,'GPS');
    reverseGeo(la,lo);
    [fullMap&&fullMarker].forEach(m=>{if(m){fullMarker.setLatLng([la,lo]);fullMap.panTo([la,lo])}});
    fetchWx(la,lo);
  },e=>setBdg('e','GPS:'+e.message.substring(0,20)),
  {enableHighAccuracy:true,maximumAge:1000,timeout:15000});
}

function setBdg(t,m){
  const b=$('gps-bdg');
  b.className='gps-bdg '+(t==='ok'?'bdg-ok':t==='e'?'bdg-e':'bdg-w');
  b.textContent=m;
}

let _gT=0,_gC='';
async function reverseGeo(la,lo){
  const now=Date.now(),c=`${la.toFixed(3)},${lo.toFixed(3)}`;
  if(now-_gT<8000||c===_gC)return;_gT=now;_gC=c;
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${la}&lon=${lo}&format=json`,
      {headers:{'Accept-Language':'zh-TW'}});
    const d=await r.json(),a=d.address;
    const place=(a.city||a.town||a.village||a.county||'').substring(0,8);
    $('wx-loc').textContent='📍'+place;
  }catch(e){}
}

function rotateCompass(h,src){
  const deg=Math.round(((h%360)+360)%360);
  $('needle').style.transform=`rotate(${deg}deg)`;
  $('hdg').textContent=deg+'°';
  const dirs=['北','東北','東','東南','南','西南','西','西北'];
  $('hdg-d').textContent=dirs[Math.round(deg/45)%8]+'('+src+')';
}

if(typeof DeviceOrientationEvent!=='undefined'&&
   typeof DeviceOrientationEvent.requestPermission!=='function'){
  window.addEventListener('deviceorientation',e=>{
    const h=e.webkitCompassHeading||(e.alpha?360-e.alpha:null);
    if(h!=null)rotateCompass(h,'陀螺儀');
  },true);
}

/* ── FULL MAP PAGE ── */
let fullMapInit=false;
function initFullMap(){
  if(fullMapInit)return;fullMapInit=true;
  fullMap=L.map('full-map',{zoomControl:true,attributionControl:false}).setView([lastLa,lastLo],15);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(fullMap);
  const ico=L.divIcon({className:'',
    html:'<div style="font-size:28px;filter:drop-shadow(0 0 10px rgba(240,165,0,.9))">🚗</div>',iconAnchor:[14,14]});
  fullMarker=L.marker([lastLa,lastLo],{icon:ico}).addTo(fullMap);
  setTimeout(()=>fullMap.invalidateSize(),200);
}

/* ── SPEED DISPLAY ── */
function setSpeed(v){
  v=Math.max(0,Math.round(v));
  const el=$('spd-n');
  el.textContent=v;
  el.className=v>3?'spd-big moving':'spd-big';
  const ab=$('alert-bar');
  if(v>120){ab.style.display='flex';$('alert-msg').textContent=`車速 ${v} km/h，請減速！`}
  else ab.style.display='none';
}

/* ── WEATHER ── */
const WIC={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',61:'🌧️',63:'🌧️',71:'❄️',80:'🌦️',95:'⛈️'};
const WDC={0:'晴天',1:'晴朗',2:'多雲',3:'陰天',45:'霧',48:'霧',51:'小雨',53:'陣雨',61:'雨',63:'中雨',71:'雪',80:'陣雨',95:'雷雨'};
let _wxT=0;
async function fetchWx(la,lo){
  if(Date.now()-_wxT<60000)return;_wxT=Date.now();
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`;
    const d=await(await fetch(u)).json(),c=d.current,cd=c.weather_code;
    $('wx-ico').textContent=WIC[cd]||'🌡️';
    $('wx-t').textContent=Math.round(c.temperature_2m);
    $('wx-d').textContent=WDC[cd]||'';
    $('wx-h').textContent=Math.round(c.relative_humidity_2m)+'%';
    $('wx-w').textContent=Math.round(c.wind_speed_10m)+'km/h';
  }catch(e){}
}
fetchWx(22.627,120.301);

/* ── RADIO ── */
let stations=[],stIdx=0,radioOn=false;
const aud=$('audio');
async function loadStations(){
  try{
    const r=await fetch('https://de1.api.radio-browser.info/json/stations/bycountrycodeexact/TW?limit=25&order=votes&reverse=true&hidebroken=true');
    stations=(await r.json()).filter(s=>s.url_resolved);
    renderRbList();if(stations.length)loadStation(0);
  }catch(e){$('freq-n').textContent='電台載入失敗'}
}
function renderRbList(){
  const ul=$('rb-list');ul.innerHTML='';
  stations.slice(0,12).forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='rb-i'+(i===0?' cur':'');
    d.textContent=`${i+1}. ${s.name}`;
    d.onclick=()=>loadStation(i);ul.appendChild(d);
  });
}
function loadStation(i){
  stIdx=Math.max(0,Math.min(i,stations.length-1));
  const s=stations[stIdx];
  $('freq-v').textContent=s.frequency?s.frequency+' MHz':'🎵 串流';
  $('freq-n').textContent=s.name;
  aud.src=s.url_resolved;
  document.querySelectorAll('.rb-i').forEach((el,j)=>{
    el.classList.toggle('cur',j===stIdx);if(j===stIdx)el.scrollIntoView({block:'nearest'});
  });
  if(radioOn)aud.play().catch(()=>{});
}
function toggleRadio(){
  radioOn=!radioOn;
  const b=$('r-play'),d=$('disc');
  if(radioOn){aud.play().catch(()=>{radioOn=false});b.textContent='⏸';b.className='mb on';d.className='disc';}
  else{aud.pause();b.textContent='▶';b.className='mb';d.className='disc paused';}
}
$('r-play').onclick=toggleRadio;
$('r-prev').onclick=()=>loadStation(stIdx-1);
$('r-next').onclick=()=>loadStation(stIdx+1);
loadStations();

function renderSC(){
  const g=$('sc-grid');g.innerHTML='';
  shortcuts.forEach((s,i)=>{

    const ico=document.createElement('div');ico.className='sc-ico2';ico.style.background=s.bg||PALETTE[0];
    if(s.ico&&s.ico.startsWith('http')){const img=document.createElement('img');img.src=s.ico;ico.appendChild(img);}
    else ico.textContent=s.ico||'🔗';
    const nm=document.createElement('div');nm.className='sc-name';nm.textContent=s.name;
    const ur=document.createElement('div');ur.className='sc-url2';ur.textContent=s.url||'';
    const acts=document.createElement('div');acts.className='sc-acts';
    const eBtn=document.createElement('div');eBtn.className='sc-ab';eBtn.textContent='✎';
    eBtn.style.cssText='color:var(--a);border-color:var(--boa)';
    eBtn.onclick=e=>{e.stopPropagation();openEdit(i)};
    const dBtn=document.createElement('div');dBtn.className='sc-ab';dBtn.textContent='✕';
    dBtn.style.cssText='color:var(--r);border-color:rgba(255,59,59,.3)';
    dBtn.onclick=e=>{e.stopPropagation();if(confirm(`刪除「${s.name}」？`)){shortcuts.splice(i,1);saveSCLS();renderSC();renderHomeSC();}};
    acts.appendChild(eBtn);acts.appendChild(dBtn);
    el.appendChild(acts);el.appendChild(ico);el.appendChild(nm);el.appendChild(ur);
    el.onclick=()=>openApp(s);g.appendChild(el);

function renderHomeSC(){
  const g=$('home-sc');g.innerHTML='';
  shortcuts.slice(0,6).forEach(s=>{
    const el=document.createElement('div');el.className='sc-btn';
    const ico=document.createElement('div');ico.className='sc-ico';
    if(s.ico&&s.ico.startsWith('http')){
      const img=document.createElement('img');img.src=s.ico;
      img.style.cssText='width:28px;height:28px;object-fit:cover;border-radius:7px';
      ico.appendChild(img);

    const lbl=document.createElement('div');lbl.className='sc-lbl';lbl.textContent=s.name;
    el.appendChild(ico);el.appendChild(lbl);el.onclick=()=>openApp(s);g.appendChild(el);

function openApp(s){
  if(s.url==='#radio'){toggleRadio();return}
  if(s.url&&s.url.startsWith('http'))window.open(s.url,'_blank');
  else showToast('⚙️ '+s.name);
}
renderSC();renderHomeSC();

/* ══ EXPORT JSON ══ */
function doExport(){
  var data = JSON.stringify(shortcuts, null, 2);
  var blob = new Blob([data], {type:'application/json;charset=utf-8'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'MBQ捷徑.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 200);
  showToast('✅ JSON 已下載');
}

/* ══ IMPORT CONFIRM UI ══ */
function showImportResult(st, imported){
  st.innerHTML = '';
  if(!imported || !imported.length){
    st.style.color = 'var(--r)';
    st.textContent = '❌ 沒有找到可匯入的資料';
    return;
  }
  st.style.color = 'var(--c)';
  st.textContent = '找到 ' + imported.length + ' 個捷徑';

  var wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap';

  var btnOk = document.createElement('button');
  btnOk.textContent = '✅ 確認匯入 (' + imported.length + ')';
  btnOk.style.cssText = 'padding:10px 18px;border-radius:10px;border:none;' +
    'background:#00e676;color:#000;font-weight:700;font-size:15px;cursor:pointer;flex:1';
  btnOk.onclick = function(){
    shortcuts = imported;
    saveSCLS();
    renderSC();
    renderHomeSC();
    st.innerHTML = '';
    st.style.color = 'var(--g)';
    st.textContent = '✅ 已匯入 ' + imported.length + ' 個捷徑';
    showToast('✅ 匯入完成！共 ' + imported.length + ' 個');
  };

  var btnNo = document.createElement('button');
  btnNo.textContent = '✕ 取消';
  btnNo.style.cssText = 'padding:10px 18px;border-radius:10px;' +
    'border:1px solid rgba(255,255,255,.15);background:transparent;' +
    'color:#8099bb;font-size:15px;cursor:pointer';
  btnNo.onclick = function(){ st.style.display = 'none'; };

  wrap.appendChild(btnOk);
  wrap.appendChild(btnNo);
  st.appendChild(wrap);
}

/* ══ IMPORT HANDLER (JSON) ══ */
(function(){
  var fileInput = $('file-input');

  fileInput.addEventListener('change', function(){
    var file = fileInput.files[0];
    if(!file) return;
    fileInput.value = ''; // reset so same file can be re-selected

    var ext = file.name.split('.').pop().toLowerCase();
    var st  = $('import-status');
    st.innerHTML = '';
    st.style.display = 'block';
    st.style.color   = 'var(--tm)';
    st.textContent   = '📂 讀取中：' + file.name;

    if(ext === 'json'){
      var reader = new FileReader();
      reader.onload = function(ev){
        try{
          var raw = (ev.target.result || '').replace(/^\uFEFF/, ''); // strip BOM
          var parsed = JSON.parse(raw);

          // accept array directly, or {shortcuts:[...]} wrapper
          var arr = Array.isArray(parsed) ? parsed
                  : (Array.isArray(parsed.shortcuts) ? parsed.shortcuts : null);

          if(!arr){
            st.style.color = 'var(--r)';
            st.textContent = '❌ JSON 格式錯誤：必須為陣列';
            return;
          }

          // normalise each entry
          var imported = [];
          arr.forEach(function(item){
            if(typeof item !== 'object' || !item) return;
            var name = String(item.name || item.名稱 || '').trim();
            if(!name) return;
            imported.push({
              name : name,
              ico  : String(item.ico  || item.圖示 || '🔗').trim() || '🔗',
              bg   : String(item.bg   || item.背景色 || PALETTE[0]).trim() || PALETTE[0],
              url  : String(item.url  || item.網址 || '').trim(),
              desc : String(item.desc || item.說明 || '').trim()
            });
          });

          showImportResult(st, imported);
        } catch(err){
          st.style.color = 'var(--r)';
          st.textContent = '❌ 解析失敗：' + err.message;
        }
      };
      reader.onerror = function(){
        st.style.color = 'var(--r)';
        st.textContent = '❌ 檔案讀取失敗';
      };
      reader.readAsText(file, 'UTF-8');

    } else {
      st.style.color = 'var(--r)';
      st.textContent = '❌ 請選擇 .json 檔案';
    }
  });
})();

/* ══ MODAL ══ */
let selIco='🔗',selColor=PALETTE[0],selImgUrl=null;
function buildEmoji(){
  const p=$('emoji-scroll');p.innerHTML='';
  EMOJIS.forEach(e=>{
    const d=document.createElement('div');d.className='ep'+(e===selIco&&!selImgUrl?' on':'');
    d.textContent=e;d.onclick=()=>{selIco=e;selImgUrl=null;$('f-img').value='';
      document.querySelectorAll('.ep').forEach(x=>x.classList.remove('on'));d.classList.add('on');updPrev()};
    p.appendChild(d);
  });
}
function buildColors(){
  const r=$('col-row');r.innerHTML='';
  PALETTE.forEach(c=>{
    const s=document.createElement('div');s.className='csw'+(c===selColor?' on':'');s.style.background=c;
    s.onclick=()=>{selColor=c;document.querySelectorAll('.csw').forEach(x=>x.classList.remove('on'));s.classList.add('on');updPrev()};
    r.appendChild(s);
  });
}
function updPrev(){
  const p=$('ico-pv');p.style.background=selColor;
  if(selImgUrl)p.innerHTML=`<img src="${selImgUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`;
  else p.textContent=selIco||'🔗';
}
function onImgUrl(url){if(url&&url.startsWith('http')){selImgUrl=url;selIco=url;}else selImgUrl=null;updPrev()}
function openAdd(){
  $('edit-idx').value=-1;$('modal-title').textContent='新增捷徑';
  $('f-name').value='';$('f-url').value='';$('f-img').value='';
  selIco='🔗';selColor=PALETTE[0];selImgUrl=null;
  buildEmoji();buildColors();updPrev();$('modal-ov').classList.add('on');
}
function openEdit(i){
  const s=shortcuts[i];
  $('edit-idx').value=i;$('modal-title').textContent='編輯捷徑';
  $('f-name').value=s.name;$('f-url').value=s.url||'';
  $('f-img').value=s.ico&&s.ico.startsWith('http')?s.ico:'';
  selIco=s.ico||'🔗';selColor=s.bg||PALETTE[0];selImgUrl=s.ico&&s.ico.startsWith('http')?s.ico:null;
  buildEmoji();buildColors();updPrev();$('modal-ov').classList.add('on');
}
function closeModal(){$('modal-ov').classList.remove('on')}
function saveSCItem(){
  const name=$('f-name').value.trim();if(!name){alert('請輸入名稱');return}
  const item={name,ico:selIco||'🔗',bg:selColor||PALETTE[0],url:$('f-url').value.trim(),desc:''};
  const idx=parseInt($('edit-idx').value);
  if(idx>=0)shortcuts[idx]=item;else shortcuts.push(item);
  saveSCLS();renderSC();renderHomeSC();closeModal();showToast('✅ 已儲存：'+name);
}

/* ══ TOAST ══ */
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',3000);
}
